# TensorRT 推理配置
tensorrt:
  engine_path: engines/LSM_conf_640_fp16.engine
  batch_size: 1
  camera_img_width: 640   # 输入图像尺寸 (相机实际输出尺寸)
  camera_img_height: 640
  cuda_device: 0

# 相机参数
camera:
  intrinsics:
    fx: 337.22194822727283
    fy: 337.22194822727283
    cx: 320.0
    cy: 320.0
    baseline: 0.05

# 深度处理配置
depth_processing:
  use_confidence_filter: true   # 是否使用置信度滤波
  filter_percentile: 20.0
  use_gradient_filter: true      # 是否使用梯度滤波
  gradient_threshold: 2        # 梯度阈值（过滤高梯度区域）
  gradient_dilation_size: 0      # 梯度区域膨胀大小（像素）

# 算法参数
algorithm:
  min_depth: 0.2
  max_depth: 100.0

# 点云生成配置
pointcloud:
  enable: true

# ROS Topics
topics:
  left_image: "/x_bot/camera_left/image_raw"
  right_image: "/x_bot/camera_right/image_raw"
  disparity: "/x_bot/camera_left/nn_disparity"
  depth: "/x_bot/camera_left/nn_depth"
  pointcloud: "/x_bot/camera_left/nn_pointcloud"
  confidence: "/x_bot/camera_left/nn_confidence"
