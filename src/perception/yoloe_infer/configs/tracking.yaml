# PointCloud Colorizer Configuration
# 点云着色器配置

# 类别名称映射 - 类别名称到ID的映射
# Classes configuration
classes:
  - name: person
    id: 0
    color: [255, 128, 128]
  - name: sofa
    id: 1
    color: [0, 255, 0]
  - name: cup
    id: 2
    color: [0, 0, 255]
  - name: book
    id: 3
    color: [255, 255, 0]
  - name: table
    id: 4
    color: [255, 0, 255]
  - name: chair
    id: 5
    color: [0, 255, 255]
  - name: desk #running shoe
    id: 6
    color: [255, 165, 0]
  - name: bed
    id: 7
    color: [128, 0, 128]
  - name: TV #$trash bin
    id: 8
    color: [0, 128, 128]
  - name: coke
    id: 9
    color: [255, 0, 0]

# 默认颜色 - 用于未定义类别的对象
default_color: [255, 255, 255]  # 白色 - White

engine_path: "package://yoloe_infer/models/yoloe-tracking.engine"
num_classes: 10
conf_thres: 0.25
iou_thres: 0.45
use_mad_filter: true
mad_threshold: 2.0 #越小过滤越多
image_topic: "/x_bot/camera_left/image_raw"
depth_topic: "/x_bot/camera_left/depth/image_raw"
# depth_topic: "/x_bot/camera_left/nn_depth"
camera_info_topic: "/x_bot/camera_left/camera_info"
mask_path: "" # Optional external finger mask; no bundled mask asset.
min_depth: 0.2

# Output topics
image_result_topic: "~/image_result"
pointcloud_colored_topic: "~/pointcloud_colored"
detections_3d_topic: "~/detections_3d"

# Ground filtering for pointcloud_colored (in odom frame)
ground_filter_z_min: 0.0

# 语义几何来源：depth 兼容 Isaac/LSM；探索入口覆盖为 fastlio。
semantic_cloud_source: fastlio
semantic_lidar_topic: /fastlio/cloud_odom # adapter 转到 odom 的单帧去畸变点云，不是累积地图
semantic_lidar_frame: mid360_link # 输出局部雷达坐标，raycast 从此原点发射
projection_fixed_frame: odom
projection_sync_slop: 0.15 # 图像与扫描的最大时间差，仿真秒
projection_occlusion_tolerance: 0.15 # 同一图像像素最前点之后允许的深度差，米

# Enable with a tracking engine (reid_p3 output) and semantic_cloud_source=fastlio.
tracking_enabled: true
tracking:
  low_threshold: 0.10
  high_threshold: 0.40
  new_track_threshold: 0.40 # Must be >= high_threshold; lower values reject startup.
  min_hits: 2
  max_age_seconds: 2.0
  match_threshold: 0.70
  spatial_gate_m: 2.0
  iou_weight: 0.30
  appearance_weight: 0.30
  spatial_weight: 0.40
  measurement_variance: 0.04 # m^2, includes projection/FAST-LIO uncertainty
  acceleration_variance: 1.0
