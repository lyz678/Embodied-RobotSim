# Nav2 配置文件 (FAST-LIO SLAM 版本)
# 用于搭配 FAST-LIO 进行 SLAM 建图和导航
# 主要区别：不启动内置 SLAM，使用外部 FAST-LIO 提供的 /map 和 TF
#
# TF 树结构：
#   map -> odom -> base_footprint -> base_link (由 FAST-LIO 提供)
# 地图话题：/map (建图时 map_builder，定位时 map_server)
# 里程计话题：/odom (由 fastlio_adapter 转换 FAST-LIO 里程计及安装外参)

# Nav2行为树导航器配置
bt_navigator:
  ros__parameters:
    # Resolved against package share by navigation.launch.py.
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    enable_stamped_cmd_vel: false           # 是否使用带时间戳的速度命令
    global_frame: map                       # 全局坐标系
    robot_base_frame: base_link             # 机器人基座坐标系
    odom_topic: /odom                     # 里程计话题 (由 fastlio_adapter 节点提供)
    bt_loop_duration: 10                    # 行为树循环间隔（毫秒）
    default_server_timeout: 200             # 动作请求应答等待（毫秒），允许仿真负载下的调度抖动
    wait_for_service_timeout: 1000          # 等待服务超时时间（毫秒）
    action_server_result_timeout: 900.0    # 动作服务器结果超时时间（秒）
    navigators: ["navigate_to_pose", "navigate_through_poses"]  # 支持的导航器类型
    navigate_to_pose:                       # 单点导航配置
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:                 # 多点导航配置
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:                       # 错误代码名称列表
      - compute_path_error_code              # 路径规划错误
      - follow_path_error_code               # 路径跟随错误

# Nav2控制器服务器配置
controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: false           # 是否使用带时间戳的速度命令
    controller_frequency: 20.0              # 控制器运行频率（Hz）
    min_x_velocity_threshold: 0.001         # X方向最小速度阈值
    min_y_velocity_threshold: 0.5           # Y方向最小速度阈值
    min_theta_velocity_threshold: 0.001     # 角度最小速度阈值
    failure_tolerance: 0.3                  # 失败容忍度（米）
    progress_checker_plugins: ["progress_checker"]    # 进度检查器插件
    goal_checker_plugins: ["general_goal_checker"]    # 目标检查器插件
    controller_plugins: ["FollowPath"]      # 控制器插件列表
    use_realtime_priority: false            # 是否使用实时优先级

    # 进度检查器配置
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_angle: 0.15
      required_movement_radius: 0.5         # 所需移动半径
      movement_time_allowance: 10.0         # 允许移动时间

    ".position_checker.stateful": false # Jazzy shim private-checker namespace workaround.

    # 通用目标检查器配置
    general_goal_checker:
      stateful: true                        # 是否有状态
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25               # XY目标容忍度（米）
      yaw_goal_tolerance: 0.4               # About 23 degrees; avoid unnecessary final heading corrections.
    FollowPath:
      # Predict coupled forward/yaw motion instead of switching between spin and drive.
      # Graceful's continuous curvature law jointly controls translation/yaw.
      plugin: "x_bot_localization::ForwardHeadingController"
      primary_controller: "nav2_graceful_controller::GracefulController"
      enable_heading_alignment: false
      tracking_goal_tolerance_margin: 0.08 # Nearest-grid-point goal distance correction; server tolerance unchanged.
      initial_rotation: false
      prefer_final_rotation: true # Only final parking orientation may rotate in place.
      allow_backward: false
      min_lookahead: 0.3
      max_lookahead: 1.0
      k_phi: 1.0
      k_delta: 2.0
      beta: 0.2
      lambda: 2.0
      v_linear_min: 0.05
      v_linear_max: 1.0
      v_angular_max: 1.2
      v_angular_min_in_place: 0.1
      slowdown_radius: 0.5
      angular_dist_threshold: 0.8
      angular_disengage_threshold: 0.3
      forward_sampling_distance: 0.6
      heading_tf_max_age: 0.5 # Latest transform must still be fresh; never wait for a future scan.
      heading_gain: 2.0
      heading_braking_accel: 2.0
      heading_braking_latency: 0.2 # Scan-rate odometry + command/actuator delay, simulation seconds.
      heading_settle_angle: 0.12
      heading_release_rate: 0.2 # Do not start driving with residual spin.
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 1.5
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      rotate_to_heading_once: false
      closed_loop: false
      position_checker:
        stateful: false
      # MPPI alternatives below apply only if primary_controller is switched back.
      motion_model: "DiffDrive"
      time_steps: 50
      model_dt: 0.05 # Must match controller_frequency=20 Hz.
      batch_size: 2000
      iteration_count: 1
      vx_std: 0.30
      vy_std: 0.0
      wz_std: 0.60 # Explore decisive turns instead of averaging small yaw commands.
      # Match the shared base_motion.yaml and downstream velocity smoother.
      vx_max: 1.0
      vx_min: 0.0 # Navigation faces the path; backup recovery uses the separate behavior server.
      vy_max: 0.0
      wz_max: 1.2
      ax_max: 1.0
      ax_min: -1.0 # Symmetric sampling limits; physical braking can still reach 2 m/s^2.
      ay_max: 0.0
      ay_min: 0.0
      az_max: 1.5
      prune_distance: 3.0
      transform_tolerance: 0.5
      temperature: 0.2
      gamma: 0.005
      visualize: false
      regenerate_noises: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0 # Balance the broad 1.5 m inflation field against path progress.
        critical_cost: 300.0
        consider_footprint: false # Costmap uses the conservative 0.47 m circular envelope.
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.4
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0 # Allow a smooth approach arc rather than rigidly aligning to a grid line.
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 15
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        offset_from_furthest: 60 # Longer path target avoids optimizing only a short, slow crawl.
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0 # Soft heading preference, not a stop-and-align requirement.
        offset_from_furthest: 12
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.7 # Allow curved approaches while keeping the front lidar facing travel.
        mode: 0 # Forward-facing path tracking for the front-mounted lidar.
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

# 本地代价地图配置（用于局部路径规划和避障）
local_costmap:
  local_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: false           # 是否使用带时间戳的速度命令
      update_frequency: 5.0                   # 代价地图更新频率（Hz）
      publish_frequency: 2.0                  # 代价地图发布频率（Hz）
      global_frame: odom                      # 全局坐标系（使用里程计坐标系）
      initial_transform_timeout: 10.0         # Allow TF discovery when restarting navigation only.
      robot_base_frame: base_link             # 机器人基座坐标系
      rolling_window: true                    # 是否使用滚动窗口（跟随机器人移动）
      width: 10                               # 代价地图宽度（米）
      height: 10                              # 代价地图高度（米）
      resolution: 0.04                        # 减少窄通道障碍格的离散误差
      # Reserve 5 cm beyond the unchanged collision-monitor envelope, so
      # path tracking does not enter a contact state that blocks recovery.
      robot_radius: 0.47
      footprint_padding: 0.01
      # /x_bot/scan is already height-filtered and projected into 2D.
      # VoxelLayer rejects a scan origin slightly below z=0 after LIO drift,
      # leaving stale lethal cells that make RPP stop indefinitely.
      # Historical SLAM occupancy belongs in the global planner. Keeping it
      # locally reintroduces old lethal cells after laser/footprint clearing,
      # blocking spin and backup even when the current scan is clear.
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.8
        inflation_radius: 1.5
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        min_obstacle_height: -0.2
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /x_bot/scan
          min_obstacle_height: -0.2
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      always_send_full_costmap: true

# 全局代价地图配置（用于全局路径规划）
# 重要：对于动态 SLAM 场景，static_layer 会实时跟踪 /map 更新
global_costmap:
  global_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: false
      update_frequency: 5.0
      publish_frequency: 5.0                  # 提高发布频率以支持 explore_lite
      global_frame: map
      initial_transform_timeout: 10.0
      robot_base_frame: base_link
      robot_radius: 0.47
      footprint_padding: 0.01
      resolution: 0.05                        # 匹配 FAST-LIO 地图分辨率
      rolling_window: false                   # 不使用滚动窗口，使用全局地图
      track_unknown_space: true
      # FAST-LIO 输出概率值: -1=unknown, 0-100=占用概率
      # 需要使用 trinary_costmap 将概率转换为 FREE/LETHAL/UNKNOWN
      lethal_cost_threshold: 65               # 概率>65视为障碍 (LETHAL)
      unknown_cost_value: 255                 # 未知区域代价 (NO_INFORMATION)
      trinary_costmap: true                   # 启用三值模式供 explore_lite 使用
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map
        subscribe_to_updates: true
        enabled: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        min_obstacle_height: -0.2
        max_obstacle_height: 2.0
        observation_sources: scan
        scan:
          topic: /x_bot/scan
          sensor_frame: base_footprint
          max_obstacle_height: 2.0
          min_obstacle_height: -0.2
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.8             # Broad gradient prefers clearance over wall-hugging shortcuts.
        inflation_radius: 1.5                 # Soft costs; retain the existing inscribed collision radius.
      always_send_full_costmap: true

# Nav2路径规划服务器配置
planner_server:
  ros__parameters:
    enable_stamped_cmd_vel: false           # 是否使用带时间戳的速度命令
    #expected_planner_frequency: 20.0      # 期望的规划器频率（已注释）
    planner_plugins: ["GridBased"]          # 路径规划器插件列表

    # 基于网格的路径规划器配置
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"  # NavFn规划器插件
      tolerance: 0.5                        # 目标点容忍度（米）
      use_astar: true                      # 是否使用A*算法（false=使用Dijkstra）
      allow_unknown: true                   # 是否允许在未知空间规划路径

# Nav2路径平滑服务器配置
smoother_server:
  ros__parameters:
    enable_stamped_cmd_vel: false           # 是否使用带时间戳的速度命令
    smoother_plugins: ["simple_smoother"]   # 路径平滑器插件列表

    # 简单路径平滑器配置
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10                    # 平滑容忍度（收敛阈值）
      max_its: 1000                        # 最大迭代次数
      do_refinement: true                   # 是否进行细化

# Nav2行为服务器配置（处理恢复行为）
behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: false           # 是否使用带时间戳的速度命令
    local_costmap_topic: local_costmap/costmap_raw      # 本地代价地图话题
    global_costmap_topic: global_costmap/costmap_raw    # 全局代价地图话题
    local_footprint_topic: local_costmap/published_footprint    # 本地足迹话题
    global_footprint_topic: global_costmap/published_footprint   # 全局足迹话题
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: map
    local_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.2
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    enable_stamped_cmd_vel: false
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    scale_velocities: True # Preserve curvature when either acceleration limit is reached.
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 0.0, 1.2]
    min_velocity: [-0.2, 0.0, -1.2]
    max_accel: [1.0, 0.0, 1.5]
    max_decel: [-2.0, 0.0, -2.0]
    odom_topic: "/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/cmd_vel_smoothed"
    # Separate automatic commands from manual /cmd_vel and /x_bot/cmd_vel.
    cmd_vel_out_topic: "/x_bot/cmd_vel_nav"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 1.0
    # Hits are already frozen in odom at scan time by contact_scan_guard.
    # Latest odom->base transform compensates motion without waiting for a future
    # 10 Hz LIO sample, which otherwise reduces command delivery to scan rate.
    base_shift_correction: False
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      # Preserve the original 0.42 m + 0.01 m padded safety footprint.
      # Planning uses an extra 5 cm margin; safety must not grow with it.
      points: "[[0.43, 0], [0.398029, 0.170727], [0.306985, 0.306985], [0.170727, 0.398029], [0, 0.43], [-0.170727, 0.398029], [-0.306985, 0.306985], [-0.398029, 0.170727], [-0.43, 0], [-0.398029, -0.170727], [-0.306985, -0.306985], [-0.170727, -0.398029], [0, -0.43], [0.170727, -0.398029], [0.306985, -0.306985], [0.398029, -0.170727]]"
      # Slow before the physical acceleration/deceleration ramp can overshoot
      # the footprint and make both spin and backup recovery impossible.
      time_before_collision: 2.0
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: true
    observation_sources: ["scan_points"]
    scan_points:
      type: "pointcloud"
      topic: "/x_bot/collision_points"
      source_timeout: 0.3 # Preserve acquisition stamp; stale/missing observations stop.
      min_height: -1.0 # Planar scan hits, already filtered by navigation obstacle height.
      max_height: 1.0
      min_range: 0.0
      enabled: True

# 停靠服务器配置（用于自动充电/停靠功能）
docking_server:
  ros__parameters:
    enable_stamped_cmd_vel: false           # 是否使用带时间戳的速度命令
    controller_frequency: 50.0              # 控制器频率（Hz）
    initial_perception_timeout: 5.0         # 初始感知超时时间（秒）
    wait_charge_timeout: 5.0                # 等待充电超时时间（秒）
    dock_approach_timeout: 30.0             # 停靠接近超时时间（秒）
    undock_linear_tolerance: 0.05           # 脱离停靠线性容忍度（米）
    undock_angular_tolerance: 0.1           # 脱离停靠角度容忍度（弧度）
    max_retries: 3                          # 最大重试次数
    base_frame: "base_link"                 # 机器人基座坐标系
    fixed_frame: "odom"                     # 固定坐标系（里程计）
    dock_backwards: false                   # 是否倒退停靠
    dock_prestaging_tolerance: 0.5          # 停靠预定位容忍度（米）

    # 停靠类型配置
    dock_plugins: ['simple_charging_dock']  # 启用的停靠插件列表
    simple_charging_dock:                   # 简单充电停靠配置
      plugin: 'opennav_docking::SimpleChargingDock'  # 插件类型
      docking_threshold: 0.05               # 停靠阈值（米）
      staging_x_offset: -0.7                # 预定位X轴偏移（米）
      use_external_detection_pose: true     # 是否使用外部检测位姿
      use_battery_status: false             # 是否使用电池状态（已禁用）
      use_stall_detection: false            # 是否使用堵转检测（已禁用）

      # 外部检测参数
      external_detection_timeout: 1.0       # 外部检测超时时间（秒）
      external_detection_translation_x: -0.18    # 外部检测X轴平移
      external_detection_translation_y: 0.0      # 外部检测Y轴平移
      external_detection_rotation_roll: -1.57    # 外部检测滚转角
      external_detection_rotation_pitch: -1.57   # 外部检测俯仰角
      external_detection_rotation_yaw: 0.0       # 外部检测偏航角
      filter_coef: 0.1                     # 滤波器系数

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
